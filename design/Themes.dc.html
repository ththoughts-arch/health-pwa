<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>컨디션별 메인 컬러</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1A1B25}a:hover{color:#3A3C4A}
</style>
</helmet>
<div style="width: 1330px; height: 640px; box-sizing: border-box; background: #FFFFFF; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; color: #1A1B25; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 80px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="{{t.card}}">
<span style="font-size: 14px; font-weight: 500; color: #3A3C4A">오늘의 컨디션</span>
<div style="display: flex; align-items: flex-end; gap: 12px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 108px; font-weight: 500; line-height: 0.85; letter-spacing: -0.04em">{{t.score}}</span>
<span style="font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 14px; background: rgba(255,255,255,0.7); margin-bottom: 6px">{{t.label}}</span>
</div>
<span style="font-size: 15px; line-height: 1.65; color: #24252F">{{t.msg}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 17px; font-weight: 700">{{t.name}}</span>
<span style="font-size: 14px; color: #5F6270">{{t.range}}</span>
<div style="display: flex; gap: 8px; margin-top: 6px">
<sc-for list="{{t.chips}}" as="c" hint-placeholder-count="3">
<span style="{{c}}"></span>
</sc-for>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1330,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      { name: '좋음 · 선라이즈', range: '컨디션 80점 이상', score: 88, label: '좋음', g: 'linear-gradient(165deg, #FFF0B8 0%, #FFC9A3 48%, #FFA3C2 100%)', c: ['#FFF0B8', '#FFC9A3', '#FFA3C2'], msg: '수면과 회복 모두 좋아요. 계획한 운동을 그대로 해도 괜찮은 날이에요.' },
      { name: '보통 · 맑은 하늘', range: '컨디션 60–79점', score: 72, label: '보통', g: 'linear-gradient(165deg, #CFF6E6 0%, #B4DEFF 50%, #D3C4FF 100%)', c: ['#CFF6E6', '#B4DEFF', '#D3C4FF'], msg: '잠은 충분했지만 회복이 덜 됐어요. 가벼운 존2 러닝 30분이면 충분해요.' },
      { name: '회복 필요 · 새벽빛', range: '컨디션 60점 미만', score: 48, label: '회복 필요', g: 'linear-gradient(165deg, #EFEDFF 0%, #DCD5FF 50%, #F8DDF0 100%)', c: ['#EFEDFF', '#DCD5FF', '#F8DDF0'], msg: '몸이 회복을 원하고 있어요. 오늘은 산책 정도만 하고 일찍 쉬어 주세요.' }
    ];
    return {
      themes: list.map((t) => ({
        ...t,
        card: 'height: 460px; box-sizing: border-box; border-radius: 32px; padding: 36px 28px; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; background: ' + t.g,
        chips: t.c.map((x) => 'width: 36px; height: 36px; border-radius: 18px; border: 1px solid rgba(26,27,37,0.08); background: ' + x)
      }))
    };
  }
}
</script>
</body>
</html>
