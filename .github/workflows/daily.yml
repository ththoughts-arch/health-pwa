# 백업용 수동 실행: intervals.icu 수집 → 점수 계산 → Firestore 저장
# 평소에는 앱의 동기화 버튼을 쓴다 (2026-10-26 예약 실행 중단 — 기상·운동 직후 바로 반영하려고)
name: Daily sync

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run sync
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          OWNER_UID: ${{ secrets.OWNER_UID }}
